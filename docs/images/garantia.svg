<text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#12211d" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">DL 84/2021 &#8212; duas datas, nao uma</text>
<line x1="90" y1="150" x2="910" y2="150" stroke="#c9d8d2" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="150" x2="637" y2="150" stroke="#0f9b7a" stroke-width="8" stroke-linecap="round"/>
<line x1="637" y1="150" x2="910" y2="150" stroke="#e0b64a" stroke-width="8" stroke-linecap="round"/>
<circle cx="90" cy="150" r="10" fill="#0f9b7a"/><circle cx="637" cy="150" r="10" fill="#e0b64a"/><circle cx="910" cy="150" r="10" fill="#b34747"/>
<text x="90" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6f57" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Compra</text><text x="90" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#5c6b66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">entrega do bem</text><text x="637" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6410" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">+2 anos</text><text x="637" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#8a6410" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">fim da presuncao</text><text x="637" y="214" text-anchor="middle" font-size="12" font-weight="400" fill="#8a6410" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a prova passa a ser SUA</text><text x="910" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#b34747" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">+3 anos</text><text x="910" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#b34747" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">fim da garantia</text>
<text x="363" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#0f6f57" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">o VENDEDOR prova que o defeito nao existia</text><text x="773" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#8a6410" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">voce prova</text>
